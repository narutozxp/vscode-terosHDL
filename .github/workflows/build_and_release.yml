name: Release TerosHDL-NARUTOZXP

on:
  push:
    branches:
      - narutozxp-dev

permissions:
  contents: write
  id-token: write

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-22.04

    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check package version
        id: version
        shell: bash
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")

          BEFORE="${{ github.event.before }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "No previous commit available."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          OLD_VERSION=$(git show "${BEFORE}:package.json" \
            | node -e "
              let data = '';
              process.stdin.on('data', c => data += c);
              process.stdin.on('end', () => {
                console.log(JSON.parse(data).version);
              });
            ")

          echo "Old version: $OLD_VERSION"
          echo "New version: $NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and release
    needs: check-version

    if: needs.check-version.outputs.changed == 'true'

    runs-on: ubuntu-22.04
    environment: marketplace-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release tag
        shell: bash
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          TAG="v${VERSION}"

          git fetch --tags

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: tag $TAG already exists"
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Install VSCE
        run: npm install -g @vscode/vsce

      - name: Build VSIX
        run: npm run package

      - name: Find VSIX
        id: vsix
        shell: bash
        run: |
          VSIX=$(find . -maxdepth 1 -type f -name "*.vsix" | head -n 1)

          if [ -z "$VSIX" ]; then
            echo "ERROR: no VSIX package generated"
            exit 1
          fi

          echo "path=$VSIX" >> "$GITHUB_OUTPUT"
          echo "VSIX: $VSIX"

      - name: Login to Microsoft Entra ID
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to VS Code Marketplace
        run: |
          vsce publish \
            --azure-credential \
            --packagePath "${{ steps.vsix.outputs.path }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          TAG="v${VERSION}"

          gh release create "$TAG" \
            "${{ steps.vsix.outputs.path }}" \
            --target "${GITHUB_SHA}" \
            --title "TerosHDL-NARUTOZXP ${TAG}" \
            --generate-notes