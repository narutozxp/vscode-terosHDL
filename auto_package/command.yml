################################################################################

- name: waveform
  title: "Open waveform viewer"
  where: ["explorer/context"]
  group: "navigation"
  when: "resourceLangId == gtkw_wavebin || resourceLangId == gtkw_waveconfig || resourceLangId == vcd"

