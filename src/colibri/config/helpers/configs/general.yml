docLink: "https://terostechnology.github.io/terosHDLdoc/docs/installation_checklist/installation"

pypath:
  description: "Python3 binary path (e.g.: /usr/bin/python3). Empty if you want to use the system path. <strong>Install teroshdl. E.g: pip3 install teroshdl</strong> <a href=https://terostechnology.github.io/terosHDLdoc/docs/installation_checklist/installation#2-python3>https://terostechnology.github.io/terosHDLdoc/docs/installation_checklist/installation#2-python3</a>"
  type: string
  value: ""

makepath:
  description: "Make binary directory (e.g.: /usr/bin). Empty if you want to use the system path."
  type: string
  value: ""

go_to_definition_vhdl:
  description: "Activate go to definition feature for VHDL (you need to restart VSCode)."
  type: boolean
  value: true

go_to_definition_verilog:
  description: "Activate go to definition feature for Verilog/SV (you need to restart VSCode)."
  type: boolean
  value: true

developer_mode:
  description: "Developer mode: be careful!!"
  type: boolean
  value: false

indexing_scope:
  description: "Module indexing scope"
  help: "Choose which files to index when the current file is not in a ZHDL project. Files in a project use that project's file list. This is a global setting."
  type: select
  value: "openFiles"
  options:
    openFiles: "Open files (default)"
    workspace: "Workspace folder"

live_parsing:
  description: "Enable live parsing (experimental)"
  help: "Update Verilog/SystemVerilog completion and outline from unsaved changes. Complex edits may be slower. Disabled by default. This is a global setting."
  type: boolean
  value: false
